[env:ATmega168]
platform = atmelavr
board = ATmega168
board_build.mcu = atmega168
board_build.f_cpu = 8000000L
framework = arduino
upload_protocol = usbasp
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0x07
upload_flags = 
	-Pusb
	-e
lib_deps = 
	https://github.com/aZholtikov/zh_rf_config

